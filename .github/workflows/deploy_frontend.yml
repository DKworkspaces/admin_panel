name: Deploy Frontend Pages to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-static-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Root Folder as Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploys everything from the root folder instead of just the frontend folder
          path: '.'

      - name: Deploy to GitHub Pages Live Link
        id: deployment
        uses: actions/deploy-pages@v4
